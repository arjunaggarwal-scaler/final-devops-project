apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secret
  namespace: taskboard
type: Opaque
stringData:
  # Database credentials. In production these come from an external secret manager
  # (e.g. AWS Secrets Manager / Sealed Secrets), not a plain-text manifest.
  POSTGRES_USER: "taskboard"
  POSTGRES_PASSWORD: "taskboard"
  # Full SQLAlchemy connection string assembled for the backend.
  DATABASE_URL: "postgresql+psycopg://taskboard:taskboard@taskboard-postgres:5432/taskboard"
