name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & Test — unit tests (fail the build) + frontend build
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: application/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (pytest)
        working-directory: application/backend
        run: pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: application/frontend
        run: |
          npm install
          npm run build

  # ---------------------------------------------------------------------------
  # 2. DevSecOps — SAST, SCA, secret scanning (all before any image is built)
  # ---------------------------------------------------------------------------
  security:
    name: DevSecOps (SAST / SCA / Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- SAST: Bandit (Python static analysis) ---
      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r application/backend/app -c security/bandit.yaml

      # --- SAST: Semgrep (multi-language rules) ---
      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep --config security/semgrep.yaml --error application/

      # --- SCA: pip-audit (Python dependency CVEs) ---
      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          pip-audit -r application/backend/requirements.txt || true

      # --- SCA: npm audit (frontend dependency CVEs) ---
      - name: SCA - npm audit
        working-directory: application/frontend
        run: |
          npm install --package-lock-only
          npm audit --audit-level=critical || true

      # --- SCA: Trivy filesystem scan (deps + IaC misconfig) ---
      - name: SCA - Trivy filesystem
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # --- Secret scanning: Gitleaks ---
      - name: Secret scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks.toml

  # ---------------------------------------------------------------------------
  # 3. Build, image-scan (security gate), and push to GHCR with SHA tags
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE:${{ github.sha }}" application/backend

      - name: Build frontend image
        run: docker build -t "$FRONTEND_IMAGE:${{ github.sha }}" application/frontend

      # --- Security gate: fail on HIGH/CRITICAL CVEs in either image ---
      - name: Image scan - Trivy (backend)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image scan - Trivy (frontend)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images (SHA-tagged)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"
          docker tag "$BACKEND_IMAGE:${{ github.sha }}" "$BACKEND_IMAGE:latest"
          docker tag "$FRONTEND_IMAGE:${{ github.sha }}" "$FRONTEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:latest"

  # ---------------------------------------------------------------------------
  # 4. Deploy to a throwaway kind cluster via Helm + smoke test
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes (kind)
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard --create-namespace \
            --set backend.image=$BACKEND_IMAGE \
            --set frontend.image=$FRONTEND_IMAGE \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.pullPolicy=Always \
            --set frontend.pullPolicy=Always \
            --set ingress.enabled=false \
            --wait --timeout 5m || true

      - name: Smoke test (pods come up)
        run: |
          kubectl get pods -n taskboard -o wide
          kubectl rollout status deployment/taskboard-taskboard-backend -n taskboard --timeout=180s || true
          kubectl get svc -n taskboard
